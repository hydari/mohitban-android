name: ساخت نقشه‌ی شهرستان‌ها (دانلود از داخل برنامه)

on:
  push:
    branches: [ main ]
    paths:
      - 'maps/split_counties.py'
      - '.github/workflows/build-county-maps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  counties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cut every provincial map into county maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pip install -q numpy
          mkdir -p out work
          # provincial map release -> province name (add a line per new province)
          while IFS='|' read -r tag file province; do
            [ -z "$tag" ] && continue
            gh release download "$tag" --repo "${{ github.repository }}" --pattern "$file" --dir work --clobber
            python3 maps/split_counties.py "work/$file" app/src/main/assets/geo/admin.geojson.gz "$province" "out/$tag"
          done <<'EOF'
          map-azarbaijan-sharghi|azarbaijan-sharghi.mbtiles|استان آذربایجان شرقی
          EOF
          # one index for the app, all county files side by side
          mkdir -p release
          python3 - <<'PY'
          import json, glob, os, shutil
          maps = []
          for idx in glob.glob('out/*/index.json'):
              d = os.path.dirname(idx)
              for m in json.load(open(idx, encoding='utf-8'))['maps']:
                  shutil.copy(os.path.join(d, m['file']), 'release/' + m['file'])
                  maps.append(m)
          maps.sort(key=lambda m: (m['province'], m['name']))
          json.dump({'version': 1, 'maps': maps}, open('release/index.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print(len(maps), 'county maps')
          PY
          ls -la release | head -40

      - name: Publish (release maps-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete maps-v1 --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create maps-v1 release/* \
            --repo "${{ github.repository }}" \
            --title "نقشه‌ی شهرستان‌ها (گشت‌یار)" \
            --notes "نقشه‌های توپوگرافی هر شهرستان برای دانلود از داخل اپلیکیشن محیط‌یار. داده‌ها: Copernicus DEM و OpenStreetMap. (ساخت شماره ${{ github.run_number }})" \
            --latest=false

      - name: Put the map list into the app
        run: |
          cp release/index.json app/src/main/assets/geo/maps.json
          git config user.name "maps-bot"
          git config user.email "maps-bot@users.noreply.github.com"
          git add app/src/main/assets/geo/maps.json
          git commit -m "County map list (run ${{ github.run_number }})" || echo "no changes"
          git push
