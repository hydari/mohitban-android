name: ساخت APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'maps/**'
      - '.github/workflows/build-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          MOHITBAN_KEY_PASSWORD: ${{ secrets.MOHITBAN_KEY_PASSWORD }}
        run: |
          if [ -n "$MOHITBAN_KEY_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/mohitban.jks.enc -out signing/mohitban.jks -pass env:MOHITBAN_KEY_PASSWORD
            echo "keystore sha256: $(sha256sum signing/mohitban.jks | cut -c1-16)"
          else
            echo "::warning::Secret MOHITBAN_KEY_PASSWORD is missing - the APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          MOHITBAN_KEY_PASSWORD: ${{ secrets.MOHITBAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|> .*failed|Unresolved|Lint found" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Mohityar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohityar-APK-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one stable release "v1.0": the previous build is replaced by the newest one
          # (map releases such as map-azarbaijan-sharghi are left alone)
          gh release delete v1.0 --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create v1.0 out/Mohityar.apk \
            --repo "${{ github.repository }}" \
            --title "محیط‌یار نسخه ۱.۰.۰" \
            --notes "فایل Mohityar.apk را دانلود و روی گوشی نصب کنید. (ساخت شماره ${{ github.run_number }})" \
            --latest
