# GDAL OSM driver configuration for the گشت‌یار map build (only the tags the map uses)
closed_ways_are_polygons=landuse,natural,place,waterway=riverbank,waterway=dock,amenity,leisure
attribute_name_laundering=yes
report_all_nodes=no
report_all_ways=no

[points]
osm_id=yes
attributes=name,name:fa,place,natural,ele
other_tags=no

[lines]
osm_id=yes
attributes=name,highway,waterway
other_tags=no

[multipolygons]
osm_id=yes
attributes=name,name:fa,landuse,natural,waterway,place
other_tags=no

[multilinestrings]
osm_id=yes
attributes=name
other_tags=no

[other_relations]
osm_id=yes
attributes=name
other_tags=no
